name: Deploy Smart Link Router

# Deploy thủ công Cloudflare Worker `smart-link-router`.
# Chạy trên hạ tầng GitHub nên không dính network allowlist của môi trường dev.
on:
  workflow_dispatch:
    inputs:
      deploy_ref:
        description: "Nhánh chứa code smart-link-router cần deploy."
        required: false
        default: "claude/fb-ads-dynamic-ab-testing-FyKjF"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deploy_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: smart-link-router
        run: npm ci || npm install

      - name: Deploy with Wrangler
        working-directory: smart-link-router
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
